<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #5ad1ff; } a:hover { color: #9be4ff; }
    button { font-family: inherit; border: 0; background: none; padding: 0; cursor: pointer; color: inherit; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: radial-gradient(130% 45% at 18% 0%, rgba(90,209,255,0.10), rgba(10,13,24,0) 62%), radial-gradient(120% 40% at 92% 4%, rgba(255,92,157,0.085), rgba(10,13,24,0) 58%), #0a0d18; color: #e9ecfa; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 54px 20px 0 20px;">
    <h1 style="margin: 0; font-family: 'Archivo Black', 'Helvetica Neue', sans-serif; font-size: 30px; letter-spacing: -0.015em;">Browse</h1>
  </div>

  <div style="padding: 14px 20px 0 20px;">
    <div style="height: 48px; border-radius: 14px; background: #171c30; display: flex; align-items: center; gap: 10px; padding: 0 14px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5f668c" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
      <span style="font-size: 15px; color: #5f668c;">Search shows, people, networks</span>
    </div>
  </div>

  <div style="display: flex; gap: 8px; padding: 16px 20px 0 20px;">
    <div style="padding: 12px 15px; border-radius: 12px; font-size: 13px; font-weight: 600; line-height: 20px; background: #5ad1ff; color: #05121c; white-space: nowrap;">Trending</div>
    <div style="padding: 12px 15px; border-radius: 12px; font-size: 13px; line-height: 20px; background: #171c30; color: #98a0c4; white-space: nowrap;">On tonight</div>
    <div style="padding: 12px 15px; border-radius: 12px; font-size: 13px; line-height: 20px; background: #171c30; color: #98a0c4; white-space: nowrap;">Sci-fi</div>
    <div style="padding: 12px 15px; border-radius: 12px; font-size: 13px; line-height: 20px; background: #171c30; color: #98a0c4; white-space: nowrap;">Comedy</div>
  </div>

  <div style="padding: 22px 20px 10px 20px; display: flex; align-items: baseline; justify-content: space-between;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #7b83aa;">Trending this week</div>
    <div style="font-size: 12px; color: #5f668c;">See all</div>
  </div>

  <div style="display: flex; gap: 12px; padding: 0 20px; overflow: hidden;">
    <sc-for list="{{trending}}" as="t" hint-placeholder-count="4">
      <div style="width: 112px; flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px;">
        <div style="position: relative; width: 112px; height: 164px; border-radius: 10px; background: {{t.posterStyle}}; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.09);">
          <button aria-label="Track this show" style="position: absolute; right: 6px; bottom: 6px; width: 30px; height: 30px; border-radius: 50%; background: rgba(10,13,24,0.72); display: flex; align-items: center; justify-content: center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#e9ecfa" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </div>
        <div style="font-size: 13px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{t.title}}</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #7b83aa; margin-top: -4px;">{{t.meta}}</div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 26px 20px 10px 20px; display: flex; align-items: baseline; justify-content: space-between;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #7b83aa;">New tonight</div>
    <div style="font-size: 12px; color: #5f668c;">3 shows</div>
  </div>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column;">
    <sc-for list="{{tonight}}" as="n" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; padding: 9px 20px;">
        <div style="width: 46px; height: 66px; flex: 0 0 auto; border-radius: 8px; background: {{n.posterStyle}}; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.09);"></div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;">
          <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{n.title}}</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #858db3;">{{n.epCode}} · {{n.time}}</span>
          <span style="font-size: 12px; color: #5f668c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{n.note}}</span>
        </div>
        <button style="height: 38px; padding: 0 14px; flex: 0 0 auto; border-radius: 11px; border: 1px solid #2c3457; color: #c3c9e6; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c3c9e6" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          Track
        </button>
      </div>
    </sc-for>
  </div>

  <div style="border-top: 1px solid #1c2238; background: #0d1120; padding: 10px 12px 24px 12px; display: flex; justify-content: space-around;">
    <div style="width: 68px; display: flex; flex-direction: column; align-items: center; gap: 5px; color: #5f668c;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7.5" width="19" height="13" rx="2.5"></rect><path d="M8 3.5l4 4 4-4"></path></svg>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;">Shows</span>
    </div>
    <div style="width: 68px; display: flex; flex-direction: column; align-items: center; gap: 5px; color: #5ad1ff;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;">Browse</span>
    </div>
    <div style="width: 68px; display: flex; flex-direction: column; align-items: center; gap: 5px; color: #5f668c;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;">Airing</span>
    </div>
    <div style="width: 68px; display: flex; flex-direction: column; align-items: center; gap: 5px; color: #5f668c;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.8"></circle><path d="M4.5 20c1.6-3.6 4.3-5.4 7.5-5.4s5.9 1.8 7.5 5.4"></path></svg>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;">You</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    var g = function (a, b) { return 'linear-gradient(155deg, ' + a + ', ' + b + ')'; };
    return {
      trending: [
        { title: 'Harbour Lights', meta: '2026 · 8 ep', posterStyle: g('#2b7d84', '#0d2028') },
        { title: 'Grand Central', meta: '2025 · 2 seasons', posterStyle: g('#a83a6b', '#2a0f22') },
        { title: 'The Undercurrent', meta: '2026 · 6 ep', posterStyle: g('#6a4aa8', '#180f2c') },
        { title: 'Fallow', meta: '2024 · 3 seasons', posterStyle: g('#2f5ea8', '#0f1430') }
      ],
      tonight: [
        { title: 'Border Country', epCode: 'S04E02', time: '21:00 BBC Two', note: 'You are 2 episodes behind', posterStyle: g('#a2762e', '#241a10') },
        { title: 'Nightingale', epCode: 'S01E09', time: '22:30 Channel 4', note: 'Season finale next week', posterStyle: g('#2b7d84', '#0d2028') },
        { title: 'The Quiet Hour', epCode: 'S01E04', time: '23:15 Sky Atlantic', note: 'New tonight', posterStyle: g('#6a4aa8', '#180f2c') }
      ]
    };
  }
}
</script>
</body>
</html>
