<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: 'Newsreader', Georgia, serif; -webkit-font-smoothing: antialiased; }
    a { color: #a8402a; } a:hover { color: #7d2e1e; }
    button { font-family: inherit; border: 0; background: none; padding: 0; cursor: pointer; color: inherit; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #f7f4ec; color: #17140d; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 56px 24px 0 24px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 34px; letter-spacing: -0.01em;">The Watch Log</h1>
      <button aria-label="Search" style="width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: flex-end;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17140d" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
      </button>
    </div>
    <div style="border-top: 1px solid #17140d; border-bottom: 1px solid #cdc4ae; padding: 7px 0 6px 0; margin-top: 10px; display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b6355;">
      <span>Thu 24 Aug</span>
      <span>5 shows · 61 to go</span>
    </div>
  </div>

  <div style="display: flex; gap: 22px; padding: 14px 24px 0 24px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; height: 44px; align-items: center;">
    <span style="color: #17140d; border-bottom: 2px solid #a8402a; padding-bottom: 3px;">Watching</span>
    <span style="color: #8d8474;">Queued</span>
    <span style="color: #8d8474;">Done</span>
  </div>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column;">
    <sc-for list="{{shows}}" as="s" hint-placeholder-count="4">
      <div style="padding: 16px 24px 16px 24px; border-bottom: 1px solid #e3ddcc; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
          <span style="font-size: 21px; font-weight: 600; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.title}}</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6b6355; flex: 0 0 auto;">{{s.watched}}/{{s.total}}</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 4px;">
          <sc-for list="{{s.ticks}}" as="t" hint-placeholder-count="20">
            <div style="width: 9px; height: 9px; background: {{t.bg}}; border: 1px solid {{t.border}};"></div>
          </sc-for>
        </div>
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #6b6355; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.epCode}} &#183; {{s.epTitle}}</span>
          <button style="height: 44px; flex: 0 0 auto; display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #a8402a; margin: -12px 0;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a8402a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>
            Mark
          </button>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="border-top: 1px solid #17140d; background: #f2eee3; padding: 14px 24px 26px 24px; display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;">
    <span style="color: #17140d; border-bottom: 2px solid #a8402a; padding-bottom: 3px;">Log</span>
    <span style="color: #8d8474;">Find</span>
    <span style="color: #8d8474;">Airing</span>
    <span style="color: #8d8474;">You</span>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    var raw = [
      { title: 'Vault City', season: 3, ep: 7, epTitle: 'The Long Drive', watched: 22, total: 34 },
      { title: 'Ash & Ember', season: 2, ep: 4, epTitle: 'Kindling', watched: 14, total: 20 },
      { title: 'Nightingale', season: 1, ep: 9, epTitle: 'Static', watched: 8, total: 16 },
      { title: 'Border Country', season: 4, ep: 2, epTitle: 'Dry Season', watched: 31, total: 48 }
    ];
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return {
      shows: raw.map(function (s) {
        var ticks = [];
        for (var i = 0; i < s.total; i++) {
          ticks.push(i < s.watched
            ? { bg: '#17140d', border: '#17140d' }
            : { bg: 'transparent', border: '#c4bba4' });
        }
        return {
          title: s.title,
          watched: s.watched,
          total: s.total,
          epCode: 'S' + pad(s.season) + 'E' + pad(s.ep),
          epTitle: s.epTitle,
          ticks: ticks
        };
      })
    };
  }
}
</script>
</body>
</html>
