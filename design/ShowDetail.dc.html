<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #e8a33d; } a:hover { color: #f2bd6b; }
    button { font-family: inherit; border: 0; background: none; padding: 0; cursor: pointer; color: inherit; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #100e0c; color: #f4efe8; display: flex; flex-direction: column; overflow: hidden;">

  <div style="position: relative; height: 268px; flex: 0 0 auto; background: linear-gradient(155deg, #4a5f8c, #171b2b);">
    <div style="position: absolute; inset: 0; background: linear-gradient(to top, #100e0c 2%, rgba(16,14,12,0.55) 45%, rgba(16,14,12,0.1) 100%);"></div>
    <div style="position: absolute; left: 0; right: 0; top: 0; padding: 54px 20px 0 20px; display: flex; justify-content: space-between;">
      <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(16,14,12,0.55); display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f4efe8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5l-7 7 7 7"></path></svg>
      </button>
      <button aria-label="Notify me" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(16,14,12,0.55); display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f4efe8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10a6 6 0 0112 0c0 4 1.5 5.5 1.5 5.5h-15S6 14 6 10z"></path><path d="M10.5 19a1.8 1.8 0 003 0"></path></svg>
      </button>
    </div>
    <div style="position: absolute; left: 20px; right: 20px; bottom: 16px; display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font-family: 'Archivo Black', 'Helvetica Neue', sans-serif; font-size: 30px; line-height: 1.05; letter-spacing: -0.015em;">Vault City</h1>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #b8ada3;">2021 · Drama · 4 seasons · 52 min</div>
    </div>
  </div>

  <div style="margin: 16px 20px 0 20px; background: #191614; border: 1px solid #262220; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 13px;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #8a8078;">Your progress</div>
        <div style="font-size: 14px; color: #b8ada3;">22 of 34 episodes · 12 left</div>
      </div>
      <div style="font-family: 'Archivo Black', 'Helvetica Neue', sans-serif; font-size: 30px; line-height: 1; color: #e8a33d;">65%</div>
    </div>
    <div style="height: 10px; border-radius: 99px; background: #2a2522; overflow: hidden;">
      <div style="width: 65%; height: 100%; border-radius: 99px; background: #e8a33d;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6f665f;">
      <span>Started 14 Mar</span>
      <span>About 10h 24m left</span>
    </div>
  </div>

  <div style="display: flex; gap: 10px; padding: 14px 20px 0 20px;">
    <button style="flex: 1; height: 48px; border-radius: 14px; background: #e8a33d; color: #171009; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#171009" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>
      Watched S03E07
    </button>
    <button style="height: 48px; padding: 0 16px; border-radius: 14px; background: #252120; color: #d6cec6; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#d6cec6" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      Set position
    </button>
  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 24px 20px 10px 20px;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #8a8078;">Seasons</div>
    <div style="font-size: 12px; color: #6f665f;">Hide watched</div>
  </div>

  <div style="flex: 1; overflow: hidden;">
    <sc-for list="{{seasons}}" as="s" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 14px; padding: 11px 20px;">
        <div style="width: 38px; height: 38px; flex: 0 0 auto; border-radius: 10px; background: #1c1917; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #b8ada3;">{{s.label}}</div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-size: 15px; font-weight: 600; color: {{s.titleColor}};">{{s.name}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8a8078;">{{s.watched}}/{{s.total}}</span>
          </div>
          <div style="height: 5px; border-radius: 99px; background: #241f1d; overflow: hidden;">
            <div style="width: {{s.pct}}%; height: 100%; border-radius: 99px; background: {{s.barColor}};"></div>
          </div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4d4642" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5l7 7-7 7"></path></svg>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    var raw = [
      { label: 'S1', name: 'Season 1', watched: 10, total: 10 },
      { label: 'S2', name: 'Season 2', watched: 10, total: 10 },
      { label: 'S3', name: 'Season 3', watched: 2, total: 10 },
      { label: 'S4', name: 'Season 4', watched: 0, total: 14 }
    ];
    return {
      seasons: raw.map(function (s) {
        var done = s.watched === s.total;
        return Object.assign({}, s, {
          pct: Math.round((s.watched / s.total) * 100),
          barColor: done ? '#4f7a5e' : '#e8a33d',
          titleColor: done ? '#8a8078' : '#f4efe8'
        });
      })
    };
  }
}
</script>
</body>
</html>
